<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo para Juzgando por la Portada</title>
    <meta
      name="description"
      content="Una demo simple de los modelos de Juzgando por la Portada"
    />

    <style>
      .app-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }

      .rectangles-container {
        display: flex;
        gap: 40px;
        align-items: center;
        margin-bottom: 20px;
      }

      .rectangle {
        width: 400px;
        min-height: 400px;
        border: 2px solid #333;
        border-radius: 8px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        background-color: #f9f9f9;
      }

      .image-upload-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }

      .upload-button {
        padding: 10px 20px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.3s ease;
      }

      .upload-button:hover {
        background-color: #45a049;
      }

      .upload-button:disabled {
        background-color: #cccccc;
        cursor: not-allowed;
      }

      .image-preview {
        max-width: 100%;
        max-height: 300px;
        object-fit: contain;
        border-radius: 4px;
      }

      .tag-display-box {
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex: 1;
      }

      .tag-item {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }

      .tag-name-box {
        padding: 6px 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background-color: #f0f0f0;
        font-weight: bold;
        min-width: 80px;
        text-align: center;
      }

      .percentage-bar-container {
        flex: 1;
        height: 24px;
        background-color: #eee;
        border-radius: 4px;
        overflow: hidden;
      }

      .percentage-bar {
        height: 100%;
        transition: width 0.3s ease;
      }

      .percentage-bar.green {
        background-color: #4CAF50;
      }

      .percentage-bar.grey {
        background-color: #9e9e9e;
      }

      .percentage-text {
        margin-left: 8px;
        font-size: 14px;
        font-weight: bold;
      }

      .arrow-container {
        display: flex;
        justify-content: center;
        margin-top: -20px;
        font-size: 32px;
      }

      .dropdown-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 400px;
      }

      .dropdown {
        padding: 10px;
        border: 2px solid #333;
        border-radius: 4px;
        font-size: 16px;
        background-color: white;
      }

      .status-text {
        font-size: 14px;
        color: #666;
      }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/onnxruntime-web/1.23.0/ort.wasm.min.js?module"></script>

    <script type="module">
      import { h, render } from "https://esm.sh/preact";
      import { useState, useEffect } from "https://esm.sh/preact/hooks";
      import htm from "https://esm.sh/htm";

      const html = htm.bind(h);

      // CONFIGURABLE MAPPINGS
      // Example node number to tag name mapping
      const nodeToTagMap = {
        0: "Comedy",
        1: "Action",
        2: "Drama",
        3: "Romance",
        4: "Horror",
        5: "Sci-Fi",
        6: "Fantasy",
        7: "Thriller",
        8: "Documentary",
        9: "Animation"
      };

      // Example ONNX model definitions
      const onnxModels = {
        "model1": { url: "models/model1.onnx", inputSize: 224 },
        "model2": { url: "models/model2.onnx", inputSize: 256 },
        "model3": { url: "models/model3.onnx", inputSize: 299 }
      };

      // Tag component
      function TagDisplay({ name, portion }) {
        const percentage = Math.round(portion * 100);
        const barColor = portion > 0.5 ? "green" : "grey";
        
        return html`
          <div class="tag-item">
            <div class="tag-name-box">${name}</div>
            <div class="percentage-bar-container">
              <div 
                class="percentage-bar ${barColor}"
                style="width: ${percentage}%"
              ></div>
            </div>
            <div class="percentage-text">${percentage}%</div>
          </div>
        `;
      }

      // Image upload box component
      function ImageUploadBox({ imageUrl, onImageUpload }) {
        return html`
          <div class="image-upload-box">
            ${imageUrl ? html`
              <img src="${imageUrl}" class="image-preview" alt="Uploaded image" />
            ` : html`
              <p>Upload an image to analyze</p>
            `}
            <button class="upload-button" onClick=${onImageUpload}>
              Upload Image
            </button>
          </div>
        `;
      }

      // Main App component
      function App() {
        const [imageUrl, setImageUrl] = useState(null);
        const [selectedModel, setSelectedModel] = useState("model1");
        const [tags, setTags] = useState([]);
        const [calculating, setCalculating] = useState(false);
        const [lastRequestId, setLastRequestId] = useState(0);

        // Handle image upload
        const handleImageUpload = () => {
          const input = document.createElement('input');
          input.type = 'file';
          input.accept = 'image/*';
          input.style.display = 'none';
          
          input.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = (event) => {
                setImageUrl(event.target.result);
                // Remove input after use
                document.body.removeChild(input);
              };
              reader.onerror = () => {
                console.error('Error reading file');
                document.body.removeChild(input);
              };
              reader.readAsDataURL(file);
            } else {
              document.body.removeChild(input);
            }
          };
          
          // Add to DOM before clicking
          document.body.appendChild(input);
          input.click();
        };

        // Simulated async calculation with deduplication
        useEffect(() => {
          if (imageUrl && selectedModel) {
            const requestId = Date.now();
            setLastRequestId(requestId);
            setCalculating(true);

            // Simulate async calculation
            const calculationTimeout = setTimeout(() => {
              // Only process if this is still the latest request
              if (requestId === lastRequestId) {
                // Example result generation - replace with actual ONNX inference:
              // const session = await ort.InferenceSession.create(onnxModels[selectedModel].url);
              // const results = await session.run({ input: processedImage });
              // const probabilities = results.output.data;
              // const tags = probabilities.map((p, idx) => ({
              //   name: nodeToTagMap[idx] || `Tag ${idx}`,
              //   portion: p
              // })).sort((a, b) => b.portion - a.portion);
                const exampleTags = Object.keys(nodeToTagMap).map(nodeId => ({
                  name: nodeToTagMap[nodeId],
                  portion: Math.random() // Random portion for demo
                })).sort((a, b) => b.portion - a.portion); // Sort descending

                setTags(exampleTags);
                setCalculating(false);
              }
            }, 500);
            
            return () => clearTimeout(calculationTimeout);
          }
        }, [imageUrl, selectedModel]);

        return html`
          <div class="app-container">
            <h1>Juzgando por la Portada</h1>
            
            <div class="rectangles-container">
              <div class="rectangle">
                <${ImageUploadBox} 
                  imageUrl=${imageUrl}
                  onImageUpload=${handleImageUpload}
                />
              </div>
              
              <div class="arrow-container">→</div>
              
              <div class="rectangle">
                <div class="tag-display-box">
                  ${calculating ? html`
                    <p>Calculating...</p>
                  ` : tags.length > 0 ? html`
                    ${tags.map(tag => html`
                      <${TagDisplay} 
                        name=${tag.name}
                        portion=${tag.portion}
                      />
                    `)}
                  ` : html`
                    <p>No results yet</p>
                  `}
                </div>
              </div>
            </div>
            
            <div class="dropdown-container">
              <label for="model-select">Select Model:</label>
              <select 
                id="model-select"
                class="dropdown"
                value=${selectedModel}
                onChange=${(e) => setSelectedModel(e.target.value)}
              >
                ${Object.keys(onnxModels).map(model => html`
                  <option value=${model}>${model}</option>
                `)}
              </select>
              ${calculating ? html`
                <p class="status-text">Calculating with ${selectedModel}...</p>
              ` : imageUrl && selectedModel ? html`
                <p class="status-text">Ready with ${selectedModel}</p>
              ` : html`
                <p class="status-text">Select model and upload image</p>
              `}
            </div>
          </div>
        `;
      }

      render(html`<${App} />`, document.body);
    </script>
  </head>

  <body></body>
</html>
