<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo para Juzgando por la Portada</title>
    <meta
      name="description"
      content="Una demo simple de los modelos de Juzgando por la Portada"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-primary: #0a0a0a;
        --bg-secondary: #1a1a1a;
        --bg-tertiary: #2a2a2a;
        --text-primary: #ffffff;
        --text-secondary: #b0b0b0;
        --accent-primary: #3b82f6;
        --accent-secondary: #10b981;
        --border-color: #404040;
        --grid-gap: 12px;
        --transition-speed: 0.3s;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        min-height: 100vh;
        line-height: 1.5;
      }

      .app-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
        padding: 40px 20px;
        max-width: 1400px;
        margin: 0 auto;
        min-height: 100vh;
      }

      h1 {
        font-size: 2.5rem;
        font-weight: 700;
        background: linear-gradient(
          135deg,
          var(--accent-primary),
          var(--accent-secondary)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-align: center;
        margin-bottom: 20px;
      }

      .rectangles-container {
        display: flex;
        gap: 60px;
        align-items: stretch;
        width: 100%;
        margin-bottom: 40px;
      }

      .rectangle {
        flex: 1;
        min-width: 600px;
        min-height: 600px;
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        background-color: var(--bg-secondary);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        transition:
          transform var(--transition-speed) ease,
          box-shadow var(--transition-speed) ease;
      }

      .rectangle:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.4);
      }

      .image-upload-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        height: 100%;
      }

      .upload-button {
        padding: 14px 28px;
        background: linear-gradient(
          135deg,
          var(--accent-primary),
          var(--accent-secondary)
        );
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        transition: all var(--transition-speed) ease;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      }

      .upload-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
      }

      .upload-button:active {
        transform: translateY(0);
      }

      .upload-button:disabled {
        background: var(--bg-tertiary);
        color: var(--text-secondary);
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
      }

      .image-preview {
        max-width: 100%;
        max-height: 400px;
        object-fit: contain;
        border-radius: 12px;
        border: 2px solid var(--border-color);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      }

      .tag-display-box {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 12px 16px;
        overflow-y: auto;
        flex: 1;
        min-height: 0;
      }

      .tag-display-box::-webkit-scrollbar {
        width: 8px;
      }

      .tag-display-box::-webkit-scrollbar-track {
        background: var(--bg-tertiary);
        border-radius: 4px;
      }

      .tag-display-box::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 4px;
      }

      .tag-display-box::-webkit-scrollbar-thumb:hover {
        background: var(--text-secondary);
      }

      .tag-header {
        display: grid;
        grid-template-columns: 120px 1fr 60px;
        align-items: center;
        gap: 16px;
        padding: 8px 16px;
        margin-bottom: 4px;
        border-bottom: 1px solid var(--border-color);
      }

      .header-label {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-secondary);
      }

      .tag-item {
        display: grid;
        grid-template-columns: 120px 1fr 60px;
        align-items: center;
        gap: 16px;
        padding: 10px 16px;
        background-color: var(--bg-tertiary);
        border-radius: 6px;
        border: 1px solid transparent;
        transition: all var(--transition-speed) ease;
        animation: fadeInUp 0.5s ease forwards;
        opacity: 0;
      }

      .tag-item:hover {
        background-color: rgba(42, 42, 42, 0.8);
        border-color: var(--accent-primary);
      }

      .tag-name {
        font-size: 15px;
        font-weight: 600;
        color: var(--text-primary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        transition: color var(--transition-speed) ease;
      }

      .tag-name.included {
        color: var(--accent-secondary);
      }

      .percentage-bar-container {
        width: 100%;
        height: 12px;
        background-color: var(--bg-secondary);
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid var(--border-color);
      }

      .percentage-bar {
        height: 100%;
        background-color: var(--text-primary);
        border-radius: 6px;
        transition:
          width 0.8s cubic-bezier(0.4, 0, 0.2, 1),
          background-color var(--transition-speed) ease;
      }

      .percentage-bar.included {
        background: linear-gradient(
          90deg,
          var(--accent-primary),
          var(--accent-secondary)
        );
      }

      .percentage-text {
        font-family: "JetBrains Mono", "Fira Code", "Consolas", monospace;
        font-size: 16px;
        font-weight: 600;
        color: var(--text-primary);
        font-variant-numeric: tabular-nums;
        text-align: right;
        min-width: 60px;
      }

      .percentage-text.included {
        color: var(--accent-secondary);
      }

      .arrow-container {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        color: var(--accent-primary);
        font-weight: bold;
        padding: 0 20px;
      }

      .dropdown-container {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 100%;
        max-width: 500px;
      }

      .dropdown-label {
        font-size: 16px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .dropdown {
        padding: 14px 20px;
        border: 2px solid var(--border-color);
        border-radius: 10px;
        font-size: 16px;
        background-color: var(--bg-tertiary);
        color: var(--text-primary);
        cursor: pointer;
        transition: border-color var(--transition-speed) ease;
        font-family: "Inter", sans-serif;
      }

      .dropdown:focus {
        outline: none;
        border-color: var(--accent-primary);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      }

      .status-text {
        font-size: 15px;
        color: var(--text-secondary);
        text-align: center;
        padding: 12px;
        background-color: var(--bg-tertiary);
        border-radius: 8px;
        border: 1px solid var(--border-color);
        transition: all var(--transition-speed) ease;
      }

      .status-text.loading {
        color: var(--accent-primary);
        border-color: var(--accent-primary);
        animation: pulse 2s infinite;
      }

      .status-text.ready {
        color: var(--accent-secondary);
        border-color: var(--accent-secondary);
      }

      .loading-spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid var(--border-color);
        border-top-color: var(--accent-primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-right: 10px;
        vertical-align: middle;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }

      @media (max-width: 1200px) {
        .rectangles-container {
          flex-direction: column;
          gap: 40px;
        }

        .rectangle {
          min-width: 100%;
          min-height: 400px;
        }

        .arrow-container {
          transform: rotate(90deg);
          padding: 20px 0;
        }
      }

      @media (max-width: 768px) {
        .app-container {
          padding: 20px 16px;
          gap: 30px;
        }

        h1 {
          font-size: 2rem;
        }

        .rectangle {
          padding: 24px;
          min-height: 350px;
        }

        .tag-display-box {
          grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
          padding: 12px;
        }

        .tag-item {
          padding: 16px;
        }
      }

      @media (max-width: 480px) {
        .tag-display-box {
          grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        }

        .tag-name {
          font-size: 14px;
        }

        .percentage-text {
          font-size: 16px;
        }
      }
    </style>

    <script>
      const onnxModelNames = {
        "Modelo base": /* conv3_filters64_dense1_neurons512.onnx */ null,
      };
    </script>

    <script type="module">
      import * as ort from "https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.mjs";

      import { h, render } from "https://esm.sh/preact";
      import { useState, useEffect } from "https://esm.sh/preact/hooks";
      import htm from "https://esm.sh/htm";

      const html = htm.bind(h);

      // CONFIGURABLE MAPPINGS
      // Example node number to tag name mapping
      const outputToGenreMap = [
        "Action",
        "Science Fiction",
        "Horror",
        "Mystery",
        "Thriller",
        "Comedy",
        "Adventure",
        "Drama",
        "Animation",
        "Family",
        "Fantasy",
        "History",
        "War",
        "Crime",
        "Romance",
        "Documentary",
        "Music",
        "TV Movie",
        "Western",
      ];

      async function loadModel(buffer) {
        if (!buffer) throw new Error("Model buffer empty");

        const model = await ort.InferenceSession.create(buffer, {
          executionProviders: ["cpu"],
        });

        return model;
      }

      const modelCache = new Map();

      async function getModel(name) {
        if (modelCache.has(name)) return modelCache.get(name);

        const buffer = onnxModelNames[name];
        const promise = loadModel(buffer).catch((err) => {
          modelCache.delete(name); // Allow retry on failure
          throw err;
        });

        modelCache.set(name, promise);
        return promise;
      }

      function nchwToNhwc(input, [N, C, H, W], keepChannels = [0, 1, 2]) {
        const outC = keepChannels.length;
        const output = new Float32Array(N * H * W * outC);

        for (let n = 0; n < N; n++) {
          for (let h = 0; h < H; h++) {
            for (let w = 0; w < W; w++) {
              for (let c = 0; c < outC; c++) {
                const inC = keepChannels[c];

                const inputIndex = n * C * H * W + inC * H * W + h * W + w;

                const outputIndex =
                  n * H * W * outC + h * W * outC + w * outC + c;

                output[outputIndex] = input[inputIndex];
              }
            }
          }
        }

        return output;
      }

      async function runInference(imageUrl, modelName) {
        const model = await getModel(modelName);

        const inputName = model.inputNames[0];
        const [, height, width, channels] = model.inputMetadata[0].shape;

        // Load image
        const img = new Image();
        img.src = imageUrl;

        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
        });

        // Image → tensor (NHWC, resized)
        const tensor = await ort.Tensor.fromImage(img, {
          resizedWidth: width,
          resizedHeight: height,
        });

        console.log(tensor);

        const data = tensor.data;

        console.log(data);

        const normalized = new Float32Array(height * width * 3);

        for (let h = 0; h < height; h++) {
          for (let w = 0; w < width; w++) {
            for (let c = 0; c < 3; c++) {
              const inputIndex = c * height * width + h * width + w;

              const outputIndex = h * width * 3 + w * 3 + c;

              normalized[outputIndex] = data[inputIndex];
            }
          }
        }

        const normalized_tensor = new ort.Tensor("float32", normalized, [
          1,
          height,
          width,
          3,
        ]);

        debugger;

        const results = await model.run({
          [inputName]: normalized_tensor,
        });

        debugger;

        const outputName = model.outputNames[0];
        const output = results[outputName].data; // length = 19

        const tags = Array.from(output)
          .map((p, i) => ({
            name: outputToGenreMap[i] || `Class ${i}`,
            portion: p,
          }))
          .sort((a, b) => b.portion - a.portion);

        return tags;
      }

      function GenreDisplay({ name, portion, index, animationKey }) {
        const [animatedPercentage, setAnimatedPercentage] = useState(0);
        const isIncluded = portion > 0.5; // Example threshold for inclusion

        useEffect(() => {
          setAnimatedPercentage(0);

          const targetPercentage = Math.round(portion * 100);
          const duration = 800;
          const startTime = Date.now();

          const animate = () => {
            const elapsed = Date.now() - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const easeProgress = 1 - Math.pow(1 - progress, 3); // Cubic ease-out

            setAnimatedPercentage(Math.round(easeProgress * targetPercentage));

            if (progress < 1) {
              requestAnimationFrame(animate);
            }
          };

          const animationDelay = index * 30;
          setTimeout(() => {
            requestAnimationFrame(animate);
          }, animationDelay);

          return () => {
            // Cleanup if component unmounts
          };
        }, [portion, index, animationKey]);

        return html`
          <div class="tag-item" style="animation-delay: ${index * 30}ms">
            <div class="tag-name ${isIncluded ? "included" : ""}">${name}</div>
            <div class="percentage-bar-container">
              <div
                class="percentage-bar ${isIncluded ? "included" : ""}"
                style="width: ${animatedPercentage}%"
              ></div>
            </div>
            <div class="percentage-text ${isIncluded ? "included" : ""}">
              ${animatedPercentage}%
            </div>
          </div>
        `;
      }

      function ImageUploadBox({ imageUrl, onImageUpload, isLoading }) {
        return html`
          <div class="image-upload-box">
            ${imageUrl
              ? html`
                  <img
                    src="${imageUrl}"
                    class="image-preview"
                    alt="Uploaded image"
                  />
                `
              : html`
                  <div
                    style="text-align: center; color: var(--text-secondary);"
                  >
                    <p style="font-size: 18px; margin-bottom: 8px;">📷</p>
                    <p>Upload an image to analyze</p>
                  </div>
                `}
            <button
              class="upload-button"
              onClick=${onImageUpload}
              disabled=${isLoading}
            >
              ${isLoading ? "Uploading..." : "Upload Image"}
            </button>
          </div>
        `;
      }

      function App() {
        const [imageUrl, setImageUrl] = useState(null);
        const [selectedModel, setSelectedModel] = useState("Modelo base");
        const [tags, setTags] = useState([]);
        const [isLoading, setIsLoading] = useState(false);
        const [isUploading, setIsUploading] = useState(false);
        const [modelChanged, setModelChanged] = useState(false);
        const [animationKey, setAnimationKey] = useState(0);

        const handleImageUpload = () => {
          const input = document.createElement("input");
          input.type = "file";
          input.accept = "image/*";
          input.style.display = "none";

          input.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
              setIsUploading(true);
              const reader = new FileReader();
              reader.onload = (event) => {
                setImageUrl(event.target.result);
                setIsUploading(false);
                // Remove input after use
                document.body.removeChild(input);
              };
              reader.onerror = () => {
                console.error("Error reading file");
                setIsUploading(false);
                document.body.removeChild(input);
              };
              reader.readAsDataURL(file);
            } else {
              document.body.removeChild(input);
            }
          };

          document.body.appendChild(input);
          input.click();
        };

        // Enhanced model change handler with animation
        const handleModelChange = (e) => {
          const newModel = e.target.value;
          setSelectedModel(newModel);
          setModelChanged(true);

          setAnimationKey((prev) => prev + 1);

          setIsLoading(true);
          setTimeout(() => setIsLoading(false), 300);
        };

        useEffect(() => {
          if (!imageUrl) return;

          let mounted = true;
          let timeoutId;

          if (!mounted) return;

          setIsLoading(true);
          setModelChanged(false);

          runInference(imageUrl, selectedModel)
            .then((result) => {
              if (mounted) {
                setTags(result);
                setAnimationKey((prev) => prev + 1); // Trigger new animations
              }
            })
            .catch((error) => {
              console.error("Inference error:", error);
            })
            .finally(() => {
              if (mounted) {
                setIsLoading(false);
              }
            });

          return () => {
            mounted = false;
          };
        }, [imageUrl, selectedModel]);

        return html`
          <div class="app-container">
            <h1>Juzgando por la Portada</h1>

            <div class="rectangles-container">
              <div class="rectangle">
                <${ImageUploadBox}
                  imageUrl=${imageUrl}
                  onImageUpload=${handleImageUpload}
                  isLoading=${isUploading}
                />
              </div>

              <div class="arrow-container">→</div>

              <div class="rectangle">
                <div class="tag-display-box">
                  ${isLoading
                    ? html`
                        <div
                          style="
                          display: flex;
                          flex-direction: column;
                          align-items: center;
                          justify-content: center;
                          height: 100%;
                          gap: 20px;
                          color: var(--text-secondary);
                        "
                        >
                          <div class="loading-spinner"></div>
                          <p>Analyzing with ${selectedModel}...</p>
                        </div>
                      `
                    : tags.length > 0
                      ? html`
                          <div class="tag-header">
                            <div class="header-label">Genre</div>
                            <div class="header-label">Confidence</div>
                            <div class="header-label">Score</div>
                          </div>
                          ${tags.map(
                            (tag, index) => html`
                              <${GenreDisplay}
                                key=${tag.name + index}
                                name=${tag.name}
                                portion=${tag.portion}
                                index=${index}
                                animationKey=${animationKey}
                              />
                            `,
                          )}
                        `
                      : html`
                          <div
                            style="
                            display: flex;
                            flex-direction: column;
                            align-items: center;
                            justify-content: center;
                            height: 100%;
                            color: var(--text-secondary);
                            text-align: center;
                            gap: 12px;
                          "
                          >
                            <p style="font-size: 24px;">📊</p>
                            <p>Upload an image to see analysis results</p>
                            <p style="font-size: 14px; opacity: 0.8;">
                              Results will appear in a table layout below
                            </p>
                          </div>
                        `}
                </div>
              </div>
            </div>

            <div class="dropdown-container">
              <label class="dropdown-label" for="model-select"
                >Select Model:</label
              >
              <select
                id="model-select"
                class="dropdown"
                value=${selectedModel}
                onChange=${handleModelChange}
                disabled=${isLoading || !imageUrl}
              >
                ${Object.keys(onnxModelNames).map(
                  (model) => html` <option value=${model}>${model}</option> `,
                )}
              </select>

              ${isLoading
                ? html`
                    <p class="status-text loading">
                      <span class="loading-spinner"></span>
                      Calculating with ${selectedModel}...
                    </p>
                  `
                : imageUrl && selectedModel
                  ? html`
                      <p class="status-text ready">
                        ✓ Ready with ${selectedModel}
                        ${modelChanged ? " (model changed)" : ""}
                      </p>
                    `
                  : html`
                      <p class="status-text">
                        Select a model and upload an image to begin analysis
                      </p>
                    `}
            </div>
          </div>
        `;
      }

      render(html`<${App} />`, document.body);
    </script>
  </head>

  <body></body>
</html>
